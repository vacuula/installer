[project]
name = "vacuula-installer"
version = "1.0.2"
description = "Install Vacuula on your Neato robot"
readme = "README.md"
authors = [
    {   name = "Max", email = "max.vacuula@eterkludd.se" },
    {   name = "Fjalar", email = "fjalarhognason@gmail.com" },
    {   name = "Philip", email = "philipmagyar@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6",
    "pyusb>=1.3.1",
    "requests>=2.34.2",
    "pyserial>=3.5",
    "zeroconf>=0.151.5",
    "httpx[http2]>=0.28.1",
    "comtypes>=1.4.17",
    "tzdata>=2026.5",
]

[project.scripts]
vacuula-installer = "vacuula_installer:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ty.environment]
python = ".venv"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.ruff]
line-length = 127
lint.select = ["E9", "F63", "F7", "F82", "E501", "C901"]
