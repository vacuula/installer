name: Build Desktop App

# Trigger via commit message:
#   build:2.3.1-b   -> build + push image tagged 2.3.1-b
#   build:1.0.0     -> build + push image tagged 1.0.0 AND latest
#   release:1.0.0    -> same as build, plus a GitHub Release with files attached
# When using release, making a beta (-b or similar) it will make a prerelease, if no beta marker, it will make a draft release to be published.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: VacuulaInstaller
  PYTHON_VERSION: "3.11"

jobs:
  prepare:
    name: Parse commit message
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      release: ${{ steps.parse.outputs.release }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse commit message
        id: parse
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          version=""
          release=false

          if [[ "$COMMIT_MSG" =~ release:([0-9A-Za-z._-]+) ]]; then
            version="${BASH_REMATCH[1]}"
            release=true
          elif [[ "$COMMIT_MSG" =~ build:([0-9A-Za-z._-]+) ]]; then
            version="${BASH_REMATCH[1]}"
          fi

          # strep
          version="${version%%[._-]}"

          if [[ -z "$version" ]]; then
            echo "No dbuild:/release: tag in commit message, nothing to do."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # X.X.X -> draft release, anything else (2.3.1-b etc.) -> pre-release
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "release=$release"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Parsed: version=$version release=$release prerelease=$prerelease"

  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    if: needs.prepare.outputs.version != '' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # Only glibc2.36 build uses this:
    container: ${{ matrix.container }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version || '0.0.0-dev' }}
      ASSET_TAG: ${{ (needs.prepare.outputs.release != 'true' || needs.prepare.outputs.prerelease == 'true') && format('-{0}', needs.prepare.outputs.version || '0.0.0-dev') || '' }}
    strategy:
      fail-fast: false
      matrix:
        # PyInstaller builds for the architecture of the runner, so each
        # macOS architecture needs its own runner.
        # ubuntu-24.04 is the current LTS runner. For maximum glibc
        # compatibility across older Linux distros, consider building
        # inside a manylinux Docker container instead.
        include:
          - os: ubuntu-24.04
            label: linux
          - os: ubuntu-24.04
            label: glibc2.36
            container: debian:bookworm
          - os: windows-latest
            label: windows
          - os: macos-latest        # Apple Silicon
            label: macos-arm64
          - os: macos-15-intel      # Intel
            label: macos-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Use uv for deps and cache lock file
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Dependencies that might be missing
      # Also sudo not present in container (glibc2.36 build) workaround
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates \
            wget file git \
            binutils \
            patchelf \
            libusb-1.0-0 \
            libgl1 libegl1 \
            libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 libgssapi-krb5-2 \
            libx11-6 libx11-xcb1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      # macOS doesn't ship libusb by default; pyusb needs it at runtime.
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      # Omit dev deps and fail on stale lock file
      - name: Install Python dependencies
        run: uv sync --locked --no-dev

      - name: Set application version
        shell: bash
        run: |
          cat > src/vacuula_installer/_build_version.py <<EOF
          APP_VERSION = "${APP_VERSION}" # version is auto-generated by GH Actions
          EOF

      # comtypes generates Python wrappers for the WPD COM libraries on first
      # use. Do it here so they end up in .venv/.../comtypes/gen and get
      # bundled, instead of being written to %TEMP% on the user's PC.
      - name: Generate comtypes wrappers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --locked --no-dev python -c "import os, comtypes.client as cc; d = os.path.join(os.environ['SystemRoot'], 'System32'); cc.GetModule(os.path.join(d, 'PortableDeviceApi.dll')); cc.GetModule(os.path.join(d, 'PortableDeviceTypes.dll')); import comtypes.gen.PortableDeviceApiLib, comtypes.gen.PortableDeviceTypesLib; print('comtypes wrappers OK')"

      # Need pillow for app icon file format conversion
      - name: Build with PyInstaller
        run: >-
          uv run --locked --no-dev
          --with pyinstaller
          --with pillow
          pyinstaller --noconfirm --clean app.spec

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/${{ env.APP_NAME }}.exe" "${{ env.APP_NAME }}${{ env.ASSET_TAG }}-windows.exe"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y "../${{ env.APP_NAME }}${{ env.ASSET_TAG }}-${{ matrix.label }}.zip" "${{ env.APP_NAME }}.app"

      # --- Linux: wrap the onedir build into an AppImage --------------
      - name: Build AppDir for AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp -r "dist/${{ env.APP_NAME }}"/. AppDir/usr/bin/
          chmod +x "AppDir/usr/bin/${{ env.APP_NAME }}"
          cp src/assets/logo.svg vacuula-installer.svg

          cat > "${{ env.APP_NAME }}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${{ env.APP_NAME }}
          Exec=${{ env.APP_NAME }}
          Icon=vacuula-installer
          StartupWMClass=${{ env.APP_NAME }}
          Categories=Utility;
          EOF

      - name: Download linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      # Deliberately NOT using linuxdeploy's "qt" plugin: PyInstaller
      # already bundles PySide6's own Qt plugins, and its runtime hook
      # points Qt at that bundled copy regardless of what else sits
      # alongside it - so layering the qt plugin on top wouldn't change
      # what the app actually loads. It also expects Qt libraries under
      # usr/lib/, a layout PyInstaller's onedir output doesn't use, and
      # real-world reports of that mismatch (linuxdeploy-plugin-qt#200)
      # show it can break platform-plugin loading rather than help.
      # Plain linuxdeploy still earns its place here: proper AppRun
      # generation, desktop/icon integration, and a safety-net scan for
      # any system library PyInstaller's own hooks might have missed.
      - name: "Package artifact (Linux): build AppImage"
        if: runner.os == 'Linux'
        env:
          # No FUSE inside the container; this also covers any AppImage that
          # linuxdeploy launches itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # "" for the "linux" entry, "-glibc2.36" for the glibc2.36 entry.
          LINUX_SUFFIX: ${{ matrix.label != 'linux' && format('-{0}', matrix.label) || '' }}
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable "AppDir/usr/bin/${{ env.APP_NAME }}" \
            --desktop-file "${{ env.APP_NAME }}.desktop" \
            --icon-file vacuula-installer.svg \
            --output appimage
          mv "${{ env.APP_NAME }}"-*.AppImage "${{ env.APP_NAME }}${{ env.ASSET_TAG }}-linux${LINUX_SUFFIX}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.label }}
          path: ${{ env.APP_NAME }}-*
          if-no-files-found: error

  # Only runs for a "release:" commit. Gathers the per-OS installers
  # produced above and attaches them to a GitHub Release.
  release:
    name: Create GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a release / upload assets
    steps:
      - name: Download all build artifacts into one folder
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.APP_NAME }}-*
          path: release-assets
          merge-multiple: true

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            flag="--prerelease"   # e.g. 2.3.1-b: published right away as a pre-release
          else
            flag="--draft"        # e.g. 1.0.0: stays hidden until you publish it
          fi

          notes="Downloads:
          - **Windows:** \`-windows.exe\`
          - **macOS, Apple Silicon (M1 and newer):** \`-macos-arm64.zip\`
          - **macOS, Intel:** \`-macos-intel.zip\`
          - **Linux:** \`-linux.AppImage\`
          - **Linux, older distributions (e.g. Debian 12):** \`-linux-glibc2.36.AppImage\` - try this one if the regular Linux AppImage fails with a \`GLIBC_x.xx not found\` error

          The macOS builds are unsigned. Open Settings -> Security & Privacy and click \"Open Anyway\" to run VacuulaInstaller
          Windows builds are unsigned. When blue popup appears, click \"More info\" and then \"Run anyway\" to run VacuulaInstaller."

          gh release create "v$VERSION" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "$notes" \
            $flag