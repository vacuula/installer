# This workflow verifies the uv lockfile and lints the code with Ruff and Ty.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # uv provisions the interpreter (project targets 3.11 via
    # .python-version / pyproject.toml) and caches the uv cache keyed on
    # the committed lockfile.
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: "3.11"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # Fail fast if pyproject.toml and uv.lock have drifted apart.
    - name: Check uv.lock is up to date
      run: uv lock --check

    # Install the locked runtime + dev dependency groups (ruff, ty).
    - name: Install dependencies
      run: uv sync --locked

    - name: Lint with Ruff
      run: uv run --locked ruff check .

    - name: Type-check with ty
      run: uv run --locked ty check --output-format github
